<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#555;display:grid;place-items:center;min-height:100vh;font-family:Tajawal,sans-serif}
  .og{width:1200px;height:630px;background:#0E2E4D;position:relative;overflow:hidden;
      display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box}
  .og::after{content:"";position:absolute;inset-inline-start:-140px;inset-block-end:-180px;
      width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(232,169,74,.20),transparent 68%)}
  .m{width:132px;margin-bottom:34px}
  h1{font-family:'Readex Pro',sans-serif;color:#fff;font-size:66px;margin:0 0 18px;font-weight:600;letter-spacing:-.01em}
  p{color:#E8A94A;font-size:27px;margin:0 0 12px}
  small{color:rgba(255,255,255,.6);font-size:20px}
  .note{color:#eee;font-family:sans-serif;font-size:13px;margin:14px 0 22px;text-align:center}
</style></head><body>
<div class="note">افتح الصفحة دي في كروم، وصدّر المستطيل ١٢٠٠×٦٣٠ كـ PNG (كليك يمين ← Inspect ← Capture node screenshot).</div>
<div class="og">
  <img class="m" src="mark-white.svg" alt="">
  <h1>رحلة صحة</h1>
  <p>عيادة علاج السمنة والتغذية العلاجية</p>
  <small>د. رنا سالم · احجزي أونلاين في أقل من دقيقة</small>
</div>
</body></html>
